# MySQL para desarrollo:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: misterio
      MYSQL_USER: misterio
      MYSQL_PASSWORD: misterio
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-datos:/var/lib/mysql

volumes:
  mysql-datos:
