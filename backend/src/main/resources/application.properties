spring.application.name=misterio-backend

# --- Base de datos. Todo configurable por variables de entorno ---
# MySQL por defecto (el de docker-compose, en el puerto 3307 para no chocar con otros proyectos).
# En la nube vale Postgres: el driver se elige por la URL, p. ej. DB_URL=jdbc:postgresql://HOST/neondb?sslmode=require
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/misterio?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USER:misterio}
spring.datasource.password=${DB_PASSWORD:misterio}
# Pool pequeño: las bases gratuitas limitan conexiones y una partida son una docena de móviles.
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# El modelo todavía está en evolución (documento base, punto 11): Hibernate
# mantiene el esquema. Cuando el modelo se cierre, pasar a migraciones (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Clave para crear partidas (cabecera X-Admin-Key). CAMBIAR en producción.
app.admin-key=${ADMIN_KEY:cambia-esta-clave}

server.port=${PORT:8080}
server.error.include-message=always

# Subida de imágenes (visiones, fotos): una a una, de hasta 5 MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
